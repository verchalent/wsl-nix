# Keeps flake.lock fresh without breaking the supply-chain cooldown:
#   nixpkgs     -> newest commit on the release branch that is at least 8 days old
#   zsh-prompt  -> latest commit of the prompt flake (our own repo)
# The result must build before it is committed to main.
# Uses no third-party actions: only git, gh and the pinned Nix installer.
name: update-lock

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  NIX_VERSION: "2.35.4" # keep in step with install.sh
  NIXPKGS_BRANCH: nixos-26.05 # keep in step with flake.nix
  COOLDOWN_DAYS: "8"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Nix
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /nix
          curl -fsSL "https://releases.nixos.org/nix/nix-${NIX_VERSION}/install" \
            | sh -s -- --no-daemon --no-modify-profile --yes
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/nix"
          echo 'experimental-features = nix-command flakes' >> "$HOME/.config/nix/nix.conf"

      - name: Pick nixpkgs revision (at least ${{ env.COOLDOWN_DAYS }} days old)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          until="$(date -u -d "${COOLDOWN_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
          rev="$(gh api "repos/NixOS/nixpkgs/commits?sha=${NIXPKGS_BRANCH}&until=${until}&per_page=1" --jq '.[0].sha')"
          [ -n "$rev" ] && [ "$rev" != null ] || { echo "no nixpkgs revision found" >&2; exit 1; }
          echo "nixpkgs rev: $rev (older than $until)"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Update lock
        run: |
          nix flake lock --override-input nixpkgs "github:NixOS/nixpkgs/${{ steps.pick.outputs.rev }}"
          nix flake update zsh-prompt

      - name: Build before committing
        run: nix build .#default --no-link

      - name: Commit and push
        run: |
          if git diff --quiet -- flake.lock && [ -z "$(git ls-files --others --exclude-standard flake.lock)" ]; then
            echo "flake.lock unchanged"
            exit 0
          fi
          git add flake.lock
          git commit -m "flake.lock: weekly update (nixpkgs ${{ steps.pick.outputs.rev }})"
          git push origin HEAD:main
